<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06161B">
<title>COMPANY DU BRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#06161B; --panel:#0F2A32; --line:rgba(255,255,255,.09);
  --ink:#EEF5F6; --muted:#8FA9B0; --teal:#2FB3C4;
  --gold:#E6B858; --gold-2:#F6D88C; --ok:#4FD18B; --bad:#FF8A80;
  --f-ku:"Vazirmatn",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-ku);line-height:1.65;padding:18px 16px;display:grid;place-items:start center}
.wrap{width:100%;max-width:460px;display:grid;gap:18px}
.hero{position:relative;border-radius:22px;padding:22px 20px;background:linear-gradient(140deg,#0F4652 0%,#0A2F37 45%,#071D22 100%);border:1px solid rgba(246,216,140,.25);text-align:center;display:grid;gap:10px}
.hero h1{margin:0;font-size:1.5rem;font-weight:900;color:#fff}
.account-badge{display:inline-block;background:rgba(255,255,255,.07);padding:6px 16px;border-radius:99px;font-weight:800;font-size:.95rem;color:var(--gold-2);border:1px solid var(--line)}

.warning-box{background:rgba(255,138,128,.08);border:1px solid rgba(255,138,128,.3);border-radius:18px;padding:16px;display:grid;gap:10px;text-align:right}
.warning-title{color:var(--bad);font-weight:900;font-size:1rem;display:flex;align-items:center;gap:6px}
.warning-text{font-size:.85px;color:#ddd;line-height:1.7}

.timer-btn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);padding:12px;border-radius:12px;font-weight:800;font-size:.95rem;text-align:center;cursor:not-allowed}

.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
dt{color:var(--muted);font-size:.8rem}
dd{margin:0;font-weight:700;font-size:1.05rem}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>COMPANY DU BRA</h1>
    <div><span class="account-badge" id="accBox">ئەکاونت: ...</span></div>
  </section>

  <!-- بەشی ئاگاداری و چاوەڕوانی -->
  <section class="warning-box" id="warningSection">
    <div class="warning-title">⚠️ ئاگادارییەکی گرنگ</div>
    <div class="warning-text">
      تکایە بەهیچ شێوەیەک ئەم Apple ID له‌ Settings ی موبایلەکەت داخل مەکە! تەنها لە App Store داخل بکە.<br><br>
      تکایە کاتێک Apple ID داخل کرد ڕاستەوخۆ بیخەرە سەر ژمارەی موبایلی خۆت.
    </div>
    <div class="timer-btn" id="timerBtn">چاوەڕوان بە (5)...</div>
  </section>

  <!-- زانیارییەکان کە سەرەتای لادەبرێن تا کاتەکە تەواو دەبێت -->
  <section class="sheet" id="dataSection" style="display:none;">
    <b>زانیاری کارت</b>
    <div id="box"></div>
  </section>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwXT21qj1UyxWQ_Yf80Ae3iNXEgUTXepU4d0ANSO8FDhhMAd8wZ4PPz3sI2OetofLIbDA/exec';
const code = (new URLSearchParams(location.search).get('c') || '').trim();

let timeLeft = 5;
const timerBtn = document.getElementById('timerBtn');
const warningSection = document.getElementById('warningSection');
const dataSection = document.getElementById('dataSection');
const accBox = document.getElementById('accBox');
const box = document.getElementById('box');

function startCountdown() {
  const interval = setInterval(() => {
    timeLeft--;
    if (timeLeft > 0) {
      timerBtn.textContent = `چاوەڕوان بە (${timeLeft})...`;
    } else {
      clearInterval(interval);
      warningSection.style.display = 'none'; // لادانی ئاگادارییەکە
      dataSection.style.display = 'grid';   // نیشاندانی زانیارییەکان
      fetchData();
    }
  }, 1000);
}

function fetchData() {
  if (!code) {
    box.innerHTML = '<div>ئەم QR کۆدە دروست نییە</div>';
    return;
  }
  fetch(API + '?action=scan&c=' + encodeURIComponent(code))
    .then(r => r.json())
    .then(d => {
      if (!d.ok) {
        box.innerHTML = '<div>هەڵە لە هێنانی زانیاری</div>';
        return;
      }
      accBox.textContent = 'ئەکاونت: ' + (d.values[0] || '---');
      let html = '';
      for (let c = 0; c < 5; c++) {
        if (!d.values[c]) continue;
        html += `<div class="item"><dt>${d.headers[c] || ''}</dt><dd>${d.values[c]}</dd></div>`;
      }
      box.innerHTML = html;
    })
    .catch(() => {
      box.innerHTML = '<div>پەیوەندی نەکرا</div>';
    });
}

startCountdown();
</script>
</body>
</html>
